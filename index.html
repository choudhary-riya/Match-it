<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavana & Mahender · Save the Date</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Audio (loops during game) -->
    <audio id="gameAudio" loop>
        <source src="audio1.mp3" type="audio/mpeg">
    </audio>

    <!-- Mute Button -->
    <button class="mute-button" id="muteButton" aria-label="Toggle music">
        <span id="muteIcon">🔊</span>
    </button>

    <!-- ============ PAGE 1: WELCOME ============ -->
    <div class="screen welcome-screen" id="welcomeScreen">
        <div class="template-wrapper">
            <img src="template1.png" alt="" class="template-bg" />
            <div class="welcome-overlay">
                <button class="start-button" id="startButton">
                    <span class="start-text">Start the Game</span>
                </button>
                <p class="welcome-hint">✨ Match the pairs to reveal our special date ✨</p>
            </div>
        </div>
    </div>

    <!-- ============ PAGE 2: MEMORY GAME ============ -->
    <div class="screen game-screen" id="gameScreen">
        <div class="game-info">
            <span class="info-pill">Moves: <strong id="moves">0</strong></span>
            <span class="info-pill">Time: <strong id="timer">00:00</strong></span>
        </div>
        
        <div class="template-wrapper">
            <img src="template2.png" alt="" class="template-bg" />
            <div class="game-board" id="gameBoard">
                <!-- 10 cards generated by JavaScript, positioned over yellow placeholders -->
            </div>
        </div>
    </div>

    <!-- ============ PAGE 3: SAVE THE DATE REVEAL ============ -->
    <div class="screen invite-screen" id="inviteScreen">
        <div class="template-wrapper">
            <img src="template3.png" alt="" class="template-bg" />
            <div class="confetti-container" id="confettiContainer"></div>
            <div class="invite-overlay">
                <div class="invite-card">
                    <p class="invite-blessing">🕉️ श्री गणेशाय नमः</p>
                    <h1 class="invite-title">Save the Date</h1>
                    <div class="invite-divider">
                        <span></span><span class="diamond">◆</span><span></span>
                    </div>
                    <div class="invite-names">
                        <span class="name">Bhavana</span>
                        <span class="amp">&</span>
                        <span class="name">Mahender</span>
                    </div>
                    <p class="invite-date">1<sup>st</sup> July 2026</p>
                    <p class="invite-venue">Om Convention Hall<br/>Narsingi, Hyderabad</p>
                    <p class="invite-message">We can't wait to celebrate with you! 💛</p>
                    <a href="https://wa.me/?text=💛%20Save%20the%20Date!%20Bhavana%20%26%20Mahender%20are%20getting%20married%20on%201st%20July%202026%20at%20Om%20Convention%20Hall,%20Narsingi,%20Hyderabad." 
                       class="share-button" target="_blank">
                        📤 Share on WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
